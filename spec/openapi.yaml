openapi: 3.1.0
info:
  title: PolyDB API
  version: 0.1.0
  description: |
    PolyDB REST API — 多数据库客户端的控制面接口。

    ## 编码约定
    - 控制面（连接管理、元数据、DDL）使用 **MessagePack** (`application/msgpack`)
    - 数据面（查询结果）使用 **Arrow IPC** (`application/vnd.apache.arrow.stream`)
    - JSON (`application/json`) 仅作为调试/握手 fallback
    - 错误统一使用 `application/json` 格式

    ## 认证（M10 起，可选启用）
    服务端以环境变量 `POLYDB_SERVER_TOKEN` 启用 Bearer 鉴权；未设置该变量时不鉴权（本机开发默认）。
    启用后，除 `GET /api/health` 与 `GET /ws`（WS 在 `hello.auth.token` 校验）外的全部 `/api/*`
    端点要求 `Authorization: Bearer <token>`，缺失或不匹配返回 401 `POLYDB_ERR_UNAUTHORIZED`。
    详见 spec/behavior.md §12。

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发服务器

security:
  # 部署级可选：未设置 POLYDB_SERVER_TOKEN 的服务端忽略本声明（behavior.md §12）。
  - bearerAuth: []

paths:
  /api/health:
    get:
      operationId: healthCheck
      summary: 健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string

  # ─── 连接管理 ───────────────────────────────────────────
  /api/connections:
    get:
      operationId: listConnections
      summary: 列出所有连接
      tags: [connections]
      responses:
        "200":
          description: 连接列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/connection.json#/definitions/ConnectionInfo"
        default:
          $ref: "#/components/responses/Error"

    post:
      operationId: createConnection
      summary: 创建新连接
      tags: [connections]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/connection.json#/definitions/CreateConnectionRequest"
      responses:
        "201":
          description: 连接已创建
          content:
            application/msgpack:
              schema:
                $ref: "schemas/connection.json#/definitions/ConnectionInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    get:
      operationId: getConnection
      summary: 获取连接详情
      tags: [connections]
      responses:
        "200":
          description: 连接信息
          content:
            application/msgpack:
              schema:
                $ref: "schemas/connection.json#/definitions/ConnectionInfo"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateConnection
      summary: 更新连接
      tags: [connections]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/connection.json#/definitions/UpdateConnectionRequest"
      responses:
        "200":
          description: 连接已更新
          content:
            application/msgpack:
              schema:
                $ref: "schemas/connection.json#/definitions/ConnectionInfo"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConnection
      summary: 删除连接
      tags: [connections]
      responses:
        "204":
          description: 连接已删除
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: testConnection
      summary: 测试连接连通性
      tags: [connections]
      responses:
        "200":
          description: 连接状态
          content:
            application/msgpack:
              schema:
                $ref: "schemas/connection.json#/definitions/ConnectionStatus"
        default:
          $ref: "#/components/responses/Error"

  # ─── 元数据 ─────────────────────────────────────────────
  /api/connections/{id}/schemas:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    get:
      operationId: listSchemas
      summary: 列出数据库模式
      tags: [metadata]
      responses:
        "200":
          description: 模式列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/metadata.json#/definitions/SchemaInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/schemas/{schema}/tables:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: schema
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTables
      summary: 列出模式下的表
      tags: [metadata]
      responses:
        "200":
          description: 表列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/metadata.json#/definitions/TableInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/schemas/{schema}/tables/{table}/columns:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: schema
        in: path
        required: true
        schema:
          type: string
      - name: table
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listColumns
      summary: 列出表的列信息
      tags: [metadata]
      responses:
        "200":
          description: 列列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/metadata.json#/definitions/ColumnInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/schemas/{schema}/tables/{table}/indexes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: schema
        in: path
        required: true
        schema:
          type: string
      - name: table
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listIndexes
      summary: 列出表的索引
      tags: [metadata]
      responses:
        "200":
          description: 索引列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/metadata.json#/definitions/IndexInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/schemas/{schema}/tables/{table}/foreign-keys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: schema
        in: path
        required: true
        schema:
          type: string
      - name: table
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listForeignKeys
      summary: 列出表的外键
      tags: [metadata]
      responses:
        "200":
          description: 外键列表
          content:
            application/msgpack:
              schema:
                type: array
                items:
                  $ref: "schemas/metadata.json#/definitions/ForeignKeyInfo"
        default:
          $ref: "#/components/responses/Error"

  # ─── 查询 ───────────────────────────────────────────────
  /api/connections/{id}/query:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: executeQuery
      summary: 执行 SQL 查询
      description: |
        执行 SQL 查询并返回结果。
        响应使用 Arrow IPC 格式（大数据集高效传输）。
        JSON 格式可用于调试（Content-Type: application/json）。
        若 body 携带 query_id，服务端在响应头 X-Query-ID 回显，可用于 POST /api/queries/{query_id}/cancel 取消。
      tags: [query]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/query.json#/definitions/QueryRequest"
          application/json:
            schema:
              $ref: "schemas/query.json#/definitions/QueryRequest"
      responses:
        "200":
          description: 查询结果
          headers:
            X-Query-ID:
              description: 服务端生成或客户端传入的查询 id
              schema:
                type: string
          content:
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                format: binary
                description: Arrow IPC stream
            application/msgpack:
              schema:
                $ref: "schemas/query.json#/definitions/QueryResult"
            application/json:
              schema:
                $ref: "schemas/query.json#/definitions/QueryResult"
        default:
          $ref: "#/components/responses/Error"

  /api/queries/{query_id}/cancel:
    parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelQuery
      summary: 取消正在执行的 HTTP 查询
      description: |
        Best-effort 取消。成功返回 204；未知/已完成的 query_id 返回 404 POLYDB_ERR_QUERY_NOT_FOUND。
        见 spec/behavior.md §2.1。
      tags: [query]
      responses:
        "204":
          description: 已取消
        "404":
          description: 查询 id 未知或已完成
          content:
            application/msgpack:
              schema:
                $ref: "schemas/error.json#/definitions/PolyDBError"
            application/json:
              schema:
                $ref: "schemas/error.json#/definitions/PolyDBError"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/query/batch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: executeBatchQuery
      summary: 批量执行 SQL 查询
      tags: [query]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/query.json#/definitions/BatchQueryRequest"
      responses:
        "200":
          description: 批量查询结果
          content:
            application/msgpack:
              schema:
                $ref: "schemas/query.json#/definitions/BatchQueryResult"
        default:
          $ref: "#/components/responses/Error"

  # ─── DDL ────────────────────────────────────────────────
  /api/connections/{id}/schemas/{schema}/tables/{table}/ddl:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: schema
        in: path
        required: true
        schema:
          type: string
      - name: table
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCreateTableDDL
      summary: 获取建表 DDL 语句
      tags: [ddl]
      responses:
        "200":
          description: DDL 语句
          content:
            application/json:
              schema:
                type: object
                required: [sql]
                properties:
                  sql:
                    type: string
                    description: CREATE TABLE 语句
        default:
          $ref: "#/components/responses/Error"

  # ─── 结构比对（Compare & Sync E2，behavior.md §14）───────
  /api/schema/diff:
    post:
      operationId: diffSchema
      summary: 比对两个连接的结构差异，产出可执行计划
      description: |
        服务端分别为 source / target 两个**已连接**的连接采集元数据快照
        （list_tables → 逐表 list_columns / list_indexes / list_foreign_keys），
        再按 behavior.md §14 的归一与匹配规则产出有序计划。
        两侧数据库种类必须相同（跨种类比对 v1 直接拒绝），Redis 一律拒绝。
        计划**只含变更条目，不含 SQL**——语句生成属 E3 的 /api/schema/ddl。
      tags: [schema_diff]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/metadata.json#/definitions/SchemaDiffRequest"
      responses:
        "200":
          description: 结构差异计划（同构时 entries 为空数组）
          content:
            application/msgpack:
              schema:
                $ref: "schemas/metadata.json#/definitions/SchemaDiffPlan"
        default:
          $ref: "#/components/responses/Error"

  /api/schema/ddl:
    post:
      operationId: generateSchemaDdl
      summary: 按勾选的结构变更条目生成可执行 DDL 脚本（含回滚）
      description: |
        入参给**连接 + 勾选条目 id**（定案见 docs/plan-compare-sync.md §6 E3 ③）：服务端重新采集两侧快照、重算 diff，
        再按 selected 过滤并生成语句——绝不信任客户端传来的计划，避免用过期条目解释新结构。
        过滤由 behavior.md §15 的两条勾选规则约束：id 必须存在于本次计划；
        进入整表重建的表必须整组勾选，两者违反都是 POLYDB_ERR_INVALID_PARAM。
        v1 **只支持 SQLite 方言**，其余种类 POLYDB_ERR_NOT_SUPPORTED（Redis 与跨种类同样拒绝）。
        响应同时给出正向脚本与回滚脚本，执行属客户端显式发起的下一步（走既有事务/execute 通道）。
      tags: [schema_ddl]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/metadata.json#/definitions/SchemaDdlRequest"
      responses:
        "200":
          description: DDL 脚本（空勾选时 statements/rollback 均为空数组）
          content:
            application/msgpack:
              schema:
                $ref: "schemas/metadata.json#/definitions/DdlScript"
        default:
          $ref: "#/components/responses/Error"

  # ─── 表数据浏览（M11，behavior.md §13）───────────────────
  /api/connections/{id}/schemas/{schema}/tables/{table}/rows/query:
    post:
      operationId: browseTableRows
      summary: 按表浏览行数据（服务端分页/排序/过滤）
      description: |
        服务端构造参数化 SQL（值全部走绑定参数，列名按方言做标识符引用）。
        服务端实际取 limit+1 行并截断，用 has_more 标记是否有下一页；
        精确总数用 rows/count 显式获取。
      tags: [data]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "schemas/common.json#/definitions/ConnectionId"
        - name: schema
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/query.json#/definitions/TableRowsRequest"
      responses:
        "200":
          description: 行数据页
          content:
            application/msgpack:
              schema:
                $ref: "schemas/query.json#/definitions/TableRowsResult"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/schemas/{schema}/tables/{table}/rows/count:
    post:
      operationId: countTableRows
      summary: 精确统计行数（显式动作，带过滤条件）
      tags: [data]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "schemas/common.json#/definitions/ConnectionId"
        - name: schema
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/query.json#/definitions/TableRowsRequest"
      responses:
        "200":
          description: 行数
          content:
            application/msgpack:
              schema:
                $ref: "schemas/query.json#/definitions/TableCountResult"
        default:
          $ref: "#/components/responses/Error"

  # ─── 事务 ───────────────────────────────────────────────
  /api/connections/{id}/transactions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: beginTransaction
      summary: 开启事务
      tags: [transactions]
      requestBody:
        content:
          application/msgpack:
            schema:
              $ref: "schemas/transaction.json#/definitions/BeginTransactionRequest"
      responses:
        "201":
          description: 事务已开启
          content:
            application/msgpack:
              schema:
                $ref: "schemas/transaction.json#/definitions/TransactionInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/transactions/{txn_id}/commit:
    parameters:
      - name: txn_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: commitTransaction
      summary: 提交事务
      tags: [transactions]
      responses:
        "200":
          description: 事务已提交
          content:
            application/msgpack:
              schema:
                $ref: "schemas/transaction.json#/definitions/TransactionInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/transactions/{txn_id}/rollback:
    parameters:
      - name: txn_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rollbackTransaction
      summary: 回滚事务
      tags: [transactions]
      responses:
        "200":
          description: 事务已回滚
          content:
            application/msgpack:
              schema:
                $ref: "schemas/transaction.json#/definitions/TransactionInfo"
        default:
          $ref: "#/components/responses/Error"

  /api/transactions/{txn_id}/execute:
    parameters:
      - name: txn_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: executeInTransaction
      summary: 在事务中执行查询
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/query.json#/definitions/QueryRequest"
      responses:
        "200":
          description: 执行结果
          content:
            application/msgpack:
              schema:
                $ref: "schemas/query.json#/definitions/QueryResult"
        default:
          $ref: "#/components/responses/Error"

  # ─── Redis KV ───────────────────────────────────────────
  /api/connections/{id}/kv/select:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: redisSelectDb
      summary: 选择 Redis 数据库
      tags: [kv]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/redis.json#/definitions/RedisSelectDbRequest"
      responses:
        "204":
          description: 已切换
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/kv/scan:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: redisScanKeys
      summary: 扫描 Redis 键
      tags: [kv]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/redis.json#/definitions/RedisScanRequest"
      responses:
        "200":
          description: 扫描结果
          content:
            application/msgpack:
              schema:
                $ref: "schemas/redis.json#/definitions/RedisScanPage"
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/kv/keys/{key}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: redisGetValue
      summary: 获取 Redis 键值
      tags: [kv]
      responses:
        "200":
          description: 键值
          content:
            application/msgpack:
              schema:
                $ref: "schemas/redis.json#/definitions/RedisValue"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: redisSetValue
      summary: 设置 Redis 键值
      tags: [kv]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/redis.json#/definitions/RedisSetRequest"
      responses:
        "204":
          description: 已设置
        default:
          $ref: "#/components/responses/Error"

  /api/connections/{id}/kv/exec:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
    post:
      operationId: redisExecCommand
      summary: 执行 Redis 命令
      tags: [kv]
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: "schemas/redis.json#/definitions/RedisExecCommandRequest"
      responses:
        "200":
          description: 命令结果
          content:
            application/msgpack:
              schema:
                $ref: "schemas/redis.json#/definitions/RedisReply"
        default:
          $ref: "#/components/responses/Error"

  # 大字段旁路取回（spec/encoding.md §5.2）
  /api/connections/{id}/blobs/{blob_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "schemas/common.json#/definitions/ConnectionId"
      - name: blob_id
        in: path
        required: true
        description: 引用 ID（`$polydb_blob:<uuid>` 的 UUID 部分）
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        required: false
        description: 单段字节区间，如 `bytes=0-1048575`（多段/语法错误按无 Range 处理）
        schema:
          type: string
    get:
      operationId: getBlob
      summary: 取回大字段内容
      description: |
        按 spec/encoding.md §5.2 取回超阈值 BLOB 内容；支持 Range 请求。
        已过期（TTL 24h 清扫）或未知引用返回 404 POLYDB_ERR_BLOB_NOT_FOUND。
      tags: [blobs]
      responses:
        "200":
          description: "全量内容（`Accept-Ranges: bytes`）"
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum: [bytes]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: "区间内容，`Content-Range: bytes a-b/len`"
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 引用不存在或已过期（POLYDB_ERR_BLOB_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: "schemas/error.json#/definitions/PolyDBError"
        "416":
          description: "Range 不可满足（`Content-Range: bytes */len`）"
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "schemas/error.json#/definitions/PolyDBError"
        default:
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema:
            $ref: "schemas/error.json#/definitions/PolyDBError"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: POLYDB_SERVER_TOKEN 启用时必填；未设置该环境变量的服务端不校验
