# CI：Rust / Go / Web 三端门禁 + 契约测试对拍（M7）。
# 契约 job 起 postgres / redis / mysql / mssql / oracle 服务容器，让网络数据库场景真跑。
# MSSQL 用 mcr.microsoft.com/mssql/server:2022，Oracle 用 gvenzl/oracle-free:23-slim。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # polydb-ui-gui holds 75 unit tests and links winit/GPUI through X11, so
      # its test binary needs the xcb and xkbcommon headers at link time. None
      # of those tests open a window, so no display or Xvfb is required.
      - name: install X11 dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-0 libssl-dev
          # libxkbcommon-dev ships libxkbcommon.so but not the unversioned x11
          # link name, while winit's X11 backend asks rustc for exactly
          # -lxkbcommon-x11. Point it at the runtime .so.0.
          if [ ! -e /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so ]; then
            sudo ln -sf libxkbcommon-x11.so.0 /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so
          fi
          # Report what the linker will actually see, so a future package rename
          # is diagnosable from the annotations instead of another blind round.
          for lib in libxcb.so libxkbcommon.so libxkbcommon-x11.so; do
            if [ -e "/usr/lib/x86_64-linux-gnu/$lib" ]; then st=yes; else st=MISSING; fi
            echo "::notice title=$lib::found=$st"
          done
      - name: fmt
        working-directory: rust
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" cargo fmt --all -- --check
      - name: clippy
        working-directory: rust
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" cargo clippy --workspace -- -D warnings
      - name: test
        working-directory: rust
        # polydb-gui holds no tests but is still linked, so the X11 headers
        # above cover both GUI crates.
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" cargo test --workspace

  go:
    name: Go (fmt / lint / vet / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned, not floated: pkg/protocol's fastpath tests assert byte
          # equality against encoding/json, and Go changed its invalid-UTF-8
          # replacement behaviour between 1.25 and 1.27, which made
          # TestAppendJSONStringMatchesEncodingJSON and
          # TestValueConstructorsMatchJSONMarshal fail on CI only.
          go-version: "1.27.1"
          cache-dependency-path: go/go.sum
      - name: protocol drift check (spec ↔ rust ↔ go ↔ ts)
        working-directory: tools/genprotocol
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" sh -c 'go run . ts --check && go run . check && go run . ops --check'
      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for: $unformatted"
            exit 1
          fi
      - name: golangci-lint
        # golangci-lint-action v6 parses the requested version with a
        # pre-v2.0 scheme and rejects "v2.13.2"; v7 is the action that
        # supports golangci-lint v2.x.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: go
      - name: vet
        working-directory: go
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go vet ./...
      - name: test
        working-directory: go
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go test ./...

  web:
    name: Web (tsc / lint / test / build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: typecheck
        working-directory: web
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm run check
      - name: lint
        working-directory: web
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm run lint
      - name: test
        working-directory: web
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm run test
      - name: build
        working-directory: web
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm run build

  contract:
    name: Contract (dual-backend 对拍)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "PolyDb_Test_2026"
        ports:
          - 1433:1433
        # The password is literal here on purpose. $${MSSQL_SA_PASSWORD} never
        # reached the healthcheck shell, so sqlcmd authenticated with the wrong
        # value and the server logged "Error 18456 ... Password did not match"
        # on every single probe. The value is already plaintext in env: above,
        # so this adds no exposure. A real start-period is still needed: MSSQL's
        # first boot initialises the master DB from scratch.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'PolyDb_Test_2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 60s
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
          ORACLE_DATABASE: ORCL
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 5m
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: test/contract/go.sum
      - name: build rust server
        working-directory: rust
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" cargo build -p polydb-server

      # `if: always()` overrides the default skip-on-failure, so this runs even
      # when "Initialize containers" failed. Emitted as annotations because the
      # raw log needs a GitHub login; this is the only way to learn which
      # service never came up.
      - name: report container status
        if: always()
        run: |
          # Read the health state from inspect instead of parsing the Status
          # column, and on failure pull .State.Health.Logs: healthcheck output
          # never lands in `docker logs`, so that is the only place to see
          # whether sqlcmd is missing, the password was rejected, or the server
          # never finished initialising.
          for c in $(docker ps -aq 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" 2>/dev/null)
            health=$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null)
            echo "${name} | health=${health:-none}"
            echo "::warning title=service container::${name} | health=${health:-none}"
            if [ "$health" = "unhealthy" ]; then
              out=$(docker inspect --format '{{range .State.Health.Logs}}{{.Output}}{{end}}' "$c" 2>/dev/null | tail -c 600 | tr '\r\n' '  ')
              out=$(printf '%s' "$out" | sed 's/%/%25/g')
              echo "::error title=unhealthy healthcheck ${name}::${out}"
              log=$(docker logs --tail 15 "$c" 2>&1 | tr '\r\n' '  ' | sed 's/%/%25/g' | head -c 600)
              echo "::error title=container log ${name}::${log}"
            fi
          done
      - name: contract tests
        working-directory: test/contract
        env:
          POLYDB_TEST_PG: postgres://postgres@localhost:5432/postgres?sslmode=disable
          POLYDB_TEST_MYSQL: mysql://root@localhost:3306/mysql
          POLYDB_TEST_REDIS: localhost:6379
          POLYDB_TEST_MSSQL: mssql://sa:PolyDb_Test_2026@localhost:1433/master
          POLYDB_TEST_ORACLE: oracle://system:oracle@localhost:1521/ORCL
        # Wrapped in gate.sh so a failure names the assertion instead of only
        # saying "exit code 1". This is the first step in the repo that has
        # ever had real databases behind it, so the failure is otherwise opaque.
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go test -count=1 -v ./...
