# polydb-server + redis 本地一键起（M7 Docker 发布）。
# 数据落在命名卷 polydb-data（即容器内 POLYDB_DATA_DIR=/data）。
services:
  polydb-server:
    image: polydb-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      POLYDB_ADDR: 0.0.0.0:8080
      POLYDB_DATA_DIR: /data
    volumes:
      - polydb-data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  polydb-data:
